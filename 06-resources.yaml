apiVersion: v1
kind: Pod
metadata:
  name: resource-demo
spec:
  containers:
  - name: nginx
    image: nginx
  resources:
    #soft limit
    requests:
      memory: "64mi" #RAM
      cpu: "100m" #cpu
    
    #hard limit #max this much resources will use
    limit:
      memory: "128mi" #RAM
      cpu: "150" #cpu